name: Publish design demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Export static design demo
        run: pnpm run build:next
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_DEMO_BANNER: '1'
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-reviewed-branches:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Remove the two reviewed, superseded Copilot branches
        shell: bash
        run: |
          set -euo pipefail
          delete_reviewed_branch() {
            local branch="$1"
            local expected="$2"
            local actual
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            if [ -z "$actual" ]; then
              echo "Already removed: $branch"
              return
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Branch changed after review; leaving it intact: $branch"
              exit 1
            fi
            git push "--force-with-lease=refs/heads/$branch:$expected" origin ":refs/heads/$branch"
          }
          delete_reviewed_branch copilot/fix-github-actions-job 1da8be2bfaa07759ba64dc76e7d711c96cca1cd6
          delete_reviewed_branch copilot/fix-github-actions-job-failure 35d09f185c2c3a471adc39261cbec0e3b5cdaf2c
